
name: Build Security AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_DIR" -maxdepth 5 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager: $SDKMANAGER"

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER_PATH" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Fix legacy sdkmanager path
        shell: bash
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' \
            "$SDKMANAGER_PATH" \
            > "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          chmod +x \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      - name: Check project files
        shell: bash
        run: |
          ls -la
          test -f main.py
          test -f buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-assistant-build
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/build/python-installs/*/buildozer.log
          if-no-files-found: warn



  




