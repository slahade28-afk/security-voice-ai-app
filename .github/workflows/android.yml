name: Build Security AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "Project files found"

      - name: Build Android APK
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROIDSDK
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build failure summary
        if: failure()
        run: |
          echo "===== CRYPTOGRAPHY ERROR CONTEXT ====="
          grep -in -B 30 -A 20 "No matching distribution found for cryptography" build.log || true
          echo "===== LAST 100 LINES ====="
          tail -n 100 build.log || true
          echo "===== ERROR LINES ====="
          grep -inE "error:|exception|traceback|failed|fatal" build.log | tail -n 80 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-AI-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Security-AI-APK
          path: bin/*.apk
          if-no-files-found: error
